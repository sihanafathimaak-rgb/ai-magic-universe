<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Magic Universe ✨</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#canvas {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

#video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.12;
    z-index: 0;
}

.title {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    color: white;
    z-index: 10;
    font-family: Arial;
}

.title h1 {
    margin: 0;
    font-size: 30px;
}

.title p {
    opacity: 0.7;
}

.status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(255,255,255,0.15);
    padding: 10px 20px;
    border-radius: 20px;
    z-index: 10;
    font-family: Arial;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div class="title">
    <h1>🌌 AI MAGIC UNIVERSE ✨</h1>
    <p>Move your finger and control the stars</p>
</div>

<div class="status" id="status">
    ⭐ Universe Ready
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const video = document.getElementById("video");
const status = document.getElementById("status");


/* CANVAS */

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* FINGER */

let fingerX = 0;
let fingerY = 0;
let fingerDetected = false;


/* STARS */

let stars = [];

const STAR_COUNT = 450;


function createStars() {

    stars = [];

    for (let i = 0; i < STAR_COUNT; i++) {

        stars.push({

            x: Math.random() * canvas.width,

            y: Math.random() * canvas.height,

            size: Math.random() * 2.5 + 0.5,

            alpha: Math.random() * 0.6 + 0.4,

            speed: Math.random() * 0.25 + 0.05

        });

    }
}

createStars();


/* ANIMATION */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for (let star of stars) {


        /* NORMAL STAR MOVEMENT */

        star.y -= star.speed;


        if (star.y < 0) {
            star.y = canvas.height;
        }


        /* MAGIC MAGNET */

        if (fingerDetected) {

            const dx = fingerX - star.x;
            const dy = fingerY - star.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);


            /*
            Stars within 450 pixels
            are attracted to finger
            */

            if (distance < 450) {

                const force =
                    (450 - distance) / 450;


                /*
                ACTUAL STAR POSITION
                IS CHANGED HERE
                */

                star.x += dx * force * 0.12;

                star.y += dy * force * 0.12;

            }

        }


        /* DRAW STAR */

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${star.alpha})`;

        ctx.fill();

    }


    /* FINGER MAGIC */

    if (fingerDetected) {


        /* MAGNETIC AREA */

        ctx.beginPath();

        ctx.arc(
            fingerX,
            fingerY,
            80,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "rgba(0,220,255,0.15)";

        ctx.lineWidth = 2;

        ctx.stroke();


        /* OUTER RING */

        ctx.beginPath();

        ctx.arc(
            fingerX,
            fingerY,
            30,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "rgba(120,220,255,0.6)";

        ctx.lineWidth = 2;

        ctx.shadowBlur = 25;

        ctx.shadowColor = "cyan";

        ctx.stroke();


        /* INNER GLOW */

        ctx.beginPath();

        ctx.arc(
            fingerX,
            fingerY,
            8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "white";

        ctx.shadowBlur = 35;

        ctx.shadowColor = "cyan";

        ctx.fill();

        ctx.shadowBlur = 0;

    }


    requestAnimationFrame(animate);

}


animate();


/* AI HAND TRACKING */

const hands = new Hands({

    locateFile: function(file) {

        return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


hands.onResults(function(results) {

    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        const hand =
            results.multiHandLandmarks[0];


        /* INDEX FINGER TIP */

        const indexFinger = hand[8];


        fingerX =
            (1 - indexFinger.x) *
            canvas.width;


        fingerY =
            indexFinger.y *
            canvas.height;


        fingerDetected = true;


        status.innerText =
            "✨ AI MAGIC ACTIVE";

    }

    else {

        fingerDetected = false;

        status.innerText =
            "☝️ Show your hand";

    }

});


/* CAMERA */

const camera = new Camera(video, {

    onFrame: async function() {

        await hands.send({
            image: video
        });

    },

    width: 640,

    height: 480

});

camera.start();

</script>

</body>
</html>
