<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Magic Universe ✨</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
        }

        #video {
            position: fixed;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.25;
        }

        #canvas {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .title {
            position: fixed;
            top: 25px;
            width: 100%;
            text-align: center;
            z-index: 5;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        p {
            opacity: 0.7;
        }

        .status {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.12);
            z-index: 5;
        }
    </style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div class="title">
    <h1>🌌 AI Magic Universe</h1>
    <p>Control the universe with your hand ✨</p>
</div>

<div class="status" id="status">
    🤖 Show your hand
</div>


<!-- AI HAND TRACKING -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const status = document.getElementById("status");


function resize() {

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize", resize);



let handX = 0;

let handY = 0;

let handDetected = false;



/* AI HAND TRACKING */

const hands = new Hands({

    locateFile: function(file) {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


hands.onResults(function(results) {

    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        const hand =
            results.multiHandLandmarks[0];


        /*
        INDEX FINGER TIP
        LANDMARK 8
        */

        const indexFinger = hand[8];


        handX =
            (1 - indexFinger.x) *
            canvas.width;


        handY =
            indexFinger.y *
            canvas.height;


        handDetected = true;


        status.innerText =
            "🤖 AI detected your hand ✨";

    }

    else {

        handDetected = false;

        status.innerText =
            "🤖 Show your hand";

    }

});



/* CAMERA */

const camera = new Camera(video, {

    onFrame: async function() {

        await hands.send({
            image: video
        });

    },

    width: 1280,

    height: 720

});


camera.start();



/* TEST AI TRACKING */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (handDetected) {

        ctx.beginPath();

        ctx.arc(
            handX,
            handY,
            12,
            0,
            Math.PI * 2
        );


        ctx.fillStyle = "white";

        ctx.shadowBlur = 30;

        ctx.shadowColor = "cyan";

        ctx.fill();

        ctx.shadowBlur = 0;

    }


    requestAnimationFrame(animate);

}


animate();

</script>

</body>
</html>
