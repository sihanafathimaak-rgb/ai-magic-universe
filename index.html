<!DOCTYPE html>
<html>
<head>
  <title>AI Magic Universe</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
    }

    #video {
      display: none;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="status">🤖 Starting AI...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const status = document.getElementById("status");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];
const STAR_COUNT = 500;

let explosionCooldown = 0;
let palmDetected = false;


// ===============================
// CREATE STARS
// ===============================

for (let i = 0; i < STAR_COUNT; i++) {

  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,

    vx: 0,
    vy: 0,

    size: Math.random() * 2 + 1
  });

}


// ===============================
// DRAW STARS
// ===============================

function drawStars() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let star of stars) {

    // movement
    star.x += star.vx;
    star.y += star.vy;

    // friction
    star.vx *= 0.97;
    star.vy *= 0.97;

    // screen wrap
    if (star.x < 0) star.x = canvas.width;
    if (star.x > canvas.width) star.x = 0;

    if (star.y < 0) star.y = canvas.height;
    if (star.y > canvas.height) star.y = 0;

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "white";
    ctx.fill();
  }

  requestAnimationFrame(drawStars);
}

drawStars();


// ===============================
// EXPLOSION
// ===============================

function explodeStars() {

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  for (let star of stars) {

    const dx = star.x - centerX;
    const dy = star.y - centerY;

    const distance = Math.sqrt(dx * dx + dy * dy) || 1;

    const force = 12;

    star.vx += (dx / distance) * force;
    star.vy += (dy / distance) * force;
  }

  // flash
  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    50,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle = "white";
  ctx.lineWidth = 8;
  ctx.stroke();

  status.innerText = "💥 STAR EXPLOSION!";

  setTimeout(() => {
    status.innerText = "✋ Show Open Palm";
  }, 700);
}


// ===============================
// MEDIAPIPE
// ===============================

const hands = new Hands({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 1,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


// ===============================
// HAND DETECTION
// ===============================

hands.onResults((results) => {

  if (
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ) {

    status.innerText = "🤚 Show your hand";

    return;
  }


  const hand = results.multiHandLandmarks[0];

  const wrist = hand[0];

  // INDEX
  const indexTip = hand[8];
  const indexPip = hand[6];

  // MIDDLE
  const middleTip = hand[12];
  const middlePip = hand[10];

  // RING
  const ringTip = hand[16];
  const ringPip = hand[14];

  // PINKY
  const pinkyTip = hand[20];
  const pinkyPip = hand[18];


  // ===============================
  // FINGER OPEN CHECK
  // ===============================

  function fingerOpen(tip, pip) {

    const tipDistance = Math.hypot(
      tip.x - wrist.x,
      tip.y - wrist.y
    );

    const pipDistance = Math.hypot(
      pip.x - wrist.x,
      pip.y - wrist.y
    );

    return tipDistance > pipDistance * 1.08;
  }


  let count = 0;

  if (fingerOpen(indexTip, indexPip))
    count++;

  if (fingerOpen(middleTip, middlePip))
    count++;

  if (fingerOpen(ringTip, ringPip))
    count++;

  if (fingerOpen(pinkyTip, pinkyPip))
    count++;


  // ===============================
  // OPEN PALM
  // ===============================

  if (count >= 3) {

    status.innerText = "✋ OPEN PALM DETECTED";

    if (
      !palmDetected &&
      Date.now() > explosionCooldown
    ) {

      palmDetected = true;

      explodeStars();

      explosionCooldown = Date.now() + 1000;
    }

  }

  else {

    palmDetected = false;

    status.innerText = "☝️ Show Open Palm";
  }

});


// ===============================
// CAMERA
// ===============================

const camera = new Camera(video, {

  onFrame: async () => {

    await hands.send({
      image: video
    });

  },

  width: 640,
  height: 480

});

camera.start();


// ===============================
// RESIZE
// ===============================

window.addEventListener("resize", () => {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

});

</script>

</body>
</html>
