<!DOCTYPE html>
<html>
<head>
  <title>AI Magic Universe</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
    }

    #video {
      display: none;
    }

    #title {
      position: fixed;
      top: 15px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      z-index: 5;
      text-shadow: 0 0 15px cyan;
    }

    #status {
      position: fixed;
      top: 60px;
      left: 15px;
      z-index: 5;
      color: white;
      background: rgba(0,0,0,0.65);
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 16px;
    }

    #controls {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 5;
      color: white;
      background: rgba(0,0,0,0.65);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div id="title">🌌 AI MAGIC UNIVERSE ✨</div>

<div id="status">🤖 Starting AI...</div>

<div id="controls">
  ☝️ 1 Finger → Magnet 🧲<br>
  ✌️ 2 Fingers → Vortex 🌀<br>
  🖐️ 3 Fingers → Explosion 💥<br>
  ✋ Full Palm → Super Explosion 🌟<br>
  👊 Fist → Black Hole 🕳️
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const video = document.getElementById("video");
const status = document.getElementById("status");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


// =====================================================
// PLANETS
// =====================================================

const planets = [
  {
    x: 0.12,
    y: 0.25,
    r: 50,
    type: "blue",
    ring: false
  },

  {
    x: 0.82,
    y: 0.22,
    r: 65,
    type: "purple",
    ring: true
  },

  {
    x: 0.88,
    y: 0.72,
    r: 38,
    type: "red",
    ring: false
  },

  {
    x: 0.18,
    y: 0.78,
    r: 30,
    type: "green",
    ring: true
  }
];


function drawPlanets() {

  for (const p of planets) {

    const x = p.x * canvas.width;
    const y = p.y * canvas.height;
    const r = p.r;


    // Planet glow

    ctx.save();

    ctx.globalAlpha = 0.18;

    ctx.beginPath();

    ctx.arc(x, y, r + 15, 0, Math.PI * 2);

    ctx.fillStyle =
      p.type === "blue" ? "#008cff" :
      p.type === "purple" ? "#a855ff" :
      p.type === "red" ? "#ff4020" :
      "#20ff9a";

    ctx.fill();

    ctx.restore();


    // Planet gradient

    const gradient = ctx.createRadialGradient(
      x - r * 0.35,
      y - r * 0.35,
      5,
      x,
      y,
      r
    );


    if (p.type === "blue") {

      gradient.addColorStop(0, "#b8f4ff");
      gradient.addColorStop(0.5, "#168cff");
      gradient.addColorStop(1, "#00183f");

    } else if (p.type === "purple") {

      gradient.addColorStop(0, "#ffd8ff");
      gradient.addColorStop(0.5, "#a238ff");
      gradient.addColorStop(1, "#21002f");

    } else if (p.type === "red") {

      gradient.addColorStop(0, "#ffb08a");
      gradient.addColorStop(0.5, "#e13b28");
      gradient.addColorStop(1, "#390500");

    } else {

      gradient.addColorStop(0, "#c0ffe0");
      gradient.addColorStop(0.5, "#20b879");
      gradient.addColorStop(1, "#00291d");
    }


    ctx.beginPath();

    ctx.arc(x, y, r, 0, Math.PI * 2);

    ctx.fillStyle = gradient;

    ctx.fill();


    // Ring

    if (p.ring) {

      ctx.save();

      ctx.translate(x, y);

      ctx.rotate(-0.25);

      ctx.beginPath();

      ctx.ellipse(
        0,
        0,
        r * 1.7,
        r * 0.4,
        0,
        0,
        Math.PI * 2
      );

      ctx.strokeStyle = "rgba(230,230,255,0.7)";
      ctx.lineWidth = 5;

      ctx.stroke();

      ctx.restore();
    }
  }
}


// =====================================================
// STARS
// =====================================================

const STAR_COUNT = 500;

let stars = [];

for (let i = 0; i < STAR_COUNT; i++) {

  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,

    vx: 0,
    vy: 0,

    size: Math.random() * 2 + 0.5,

    alpha: Math.random()
  });
}


// =====================================================
// HAND VARIABLES
// =====================================================

let fingerDetected = false;

let fingerX = 0;
let fingerY = 0;

let palmX = 0;
let palmY = 0;

let gesture = -1;

let lastExplosion = 0;


// =====================================================
// MAGNET
// =====================================================

function magnetEffect() {

  if (!fingerDetected) return;

  if (gesture !== 1) return;


  for (const star of stars) {

    const dx = fingerX - star.x;
    const dy = fingerY - star.y;

    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if (distance < 400 && distance > 5) {

      const force =
        (400 - distance) / 400;


      star.x += dx * force * 0.04;
      star.y += dy * force * 0.04;


      // swirl

      star.x += -dy * force * 0.015;
      star.y += dx * force * 0.015;
    }
  }
}


// =====================================================
// VORTEX
// =====================================================

function vortexEffect() {

  if (!fingerDetected) return;

  if (gesture !== 2) return;


  for (const star of stars) {

    const dx = star.x - palmX;
    const dy = star.y - palmY;

    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if (distance < 450 && distance > 15) {

      const force =
        (450 - distance) / 450;


      // Rotation

      star.x += -dy * force * 0.03;
      star.y += dx * force * 0.03;


      // Small attraction

      star.x += -dx * force * 0.008;
      star.y += -dy * force * 0.008;
    }
  }
}


// =====================================================
// EXPLOSION
// =====================================================

function explode(power) {

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;


  for (const star of stars) {

    const dx = star.x - cx;
    const dy = star.y - cy;

    const distance =
      Math.sqrt(dx * dx + dy * dy) || 1;


    star.vx += (dx / distance) * power;
    star.vy += (dy / distance) * power;
  }
}


// =====================================================
// BLACK HOLE
// =====================================================

function blackHoleEffect() {

  if (!fingerDetected) return;

  if (gesture !== 0) return;


  for (const star of stars) {

    const dx = palmX - star.x;
    const dy = palmY - star.y;

    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if (distance < 450 && distance > 8) {

      const force =
        (450 - distance) / 450;


      star.x += dx * force * 0.045;
      star.y += dy * force * 0.045;


      // Rotation

      star.x += -dy * force * 0.025;
      star.y += dx * force * 0.025;
    }


    if (distance < 10) {

      star.x =
        Math.random() * canvas.width;

      star.y =
        Math.random() * canvas.height;

      star.vx = 0;
      star.vy = 0;
    }
  }


  // Black hole

  ctx.beginPath();

  ctx.arc(
    palmX,
    palmY,
    38,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "black";

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    palmX,
    palmY,
    60,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle = "rgba(180,100,255,0.8)";
  ctx.lineWidth = 5;

  ctx.stroke();


  ctx.beginPath();

  ctx.arc(
    palmX,
    palmY,
    82,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle = "rgba(0,255,255,0.35)";
  ctx.lineWidth = 3;

  ctx.stroke();
}


// =====================================================
// ANIMATION
// =====================================================

function animate() {

  // Clean background

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // Dark space

  ctx.fillStyle = "#020008";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // PLANETS FIRST

  drawPlanets();


  // STARS

  for (const star of stars) {

    star.x += star.vx;
    star.y += star.vy;


    // friction

    star.vx *= 0.97;
    star.vy *= 0.97;


    // wrap

    if (star.x < 0)
      star.x = canvas.width;

    if (star.x > canvas.width)
      star.x = 0;

    if (star.y < 0)
      star.y = canvas.height;

    if (star.y > canvas.height)
      star.y = 0;


    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();
  }


  // EFFECTS

  magnetEffect();

  vortexEffect();

  blackHoleEffect();


  // Finger ring

  if (
    fingerDetected &&
    gesture === 1
  ) {

    ctx.beginPath();

    ctx.arc(
      fingerX,
      fingerY,
      25,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle = "#00ffff";

    ctx.lineWidth = 4;

    ctx.stroke();
  }


  requestAnimationFrame(animate);
}


animate();


// =====================================================
// MEDIAPIPE
// =====================================================

const hands = new Hands({

  locateFile: (file) => {

    return (
      "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
      file
    );
  }

});


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 1,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


// =====================================================
// HAND RESULTS
// =====================================================

hands.onResults((results) => {


  if (
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ) {

    fingerDetected = false;

    gesture = -1;

    status.innerText =
      "🤚 Show your hand";

    return;
  }


  const hand =
    results.multiHandLandmarks[0];


  const wrist = hand[0];


  // Index position

  fingerDetected = true;


  fingerX =
    (1 - hand[8].x) *
    canvas.width;

  fingerY =
    hand[8].y *
    canvas.height;


  // Palm position

  palmX =
    (1 - hand[9].x) *
    canvas.width;

  palmY =
    hand[9].y *
    canvas.height;


  // =================================================
  // FINGER DETECTION
  // =================================================

  function isOpen(tip, pip) {

    const tipDistance =
      Math.hypot(
        tip.x - wrist.x,
        tip.y - wrist.y
      );


    const pipDistance =
      Math.hypot(
        pip.x - wrist.x,
        pip.y - wrist.y
      );


    return (
      tipDistance >
      pipDistance * 1.05
    );
  }


  const index =
    isOpen(hand[8], hand[6]);


  const middle =
    isOpen(hand[12], hand[10]);


  const ring =
    isOpen(hand[16], hand[14]);


  const pinky =
    isOpen(hand[20], hand[18]);


  let count = 0;


  if (index) count++;
  if (middle) count++;
  if (ring) count++;
  if (pinky) count++;


  // =================================================
  // FULL PALM
  // =================================================

  if (count === 4) {

    gesture = 4;

    status.innerText =
      "✋ FULL PALM — SUPER EXPLOSION 🌟";


    const now = Date.now();


    if (now - lastExplosion > 1000) {

      explode(18);

      lastExplosion = now;
    }

  }


  // =================================================
  // 3 FINGERS
  // =================================================

  else if (count === 3) {

    gesture = 3;

    status.innerText =
      "🖐️ 3 FINGERS — EXPLOSION 💥";


    const now = Date.now();


    if (now - lastExplosion > 1000) {

      explode(10);

      lastExplosion = now;
    }

  }


  // =================================================
  // 2 FINGERS
  // =================================================

  else if (count === 2) {

    gesture = 2;

    status.innerText =
      "✌️ TWO FINGERS — COSMIC VORTEX 🌀";

  }


  // =================================================
  // 1 FINGER
  // =================================================

  else if (count === 1) {

    gesture = 1;

    status.innerText =
      "☝️ MAGIC MAGNET ACTIVE 🧲";

  }


  // =================================================
  // FIST
  // =================================================

  else {

    gesture = 0;

    status.innerText =
      "👊 BLACK HOLE ACTIVE 🕳️";
  }

});


// =====================================================
// CAMERA
// =====================================================

const camera =
  new Camera(video, {

    onFrame: async () => {

      await hands.send({
        image: video
      });

    },

    width: 640,
    height: 480

  });


camera.start();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener("resize", () => {

  canvas.width = window.innerWidth;

  canvas.height = window.innerHeight;

});

</script>

</body>
</html>
