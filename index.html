<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Magic Universe ✨</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#canvas {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

#video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.10;
    z-index: 0;
}

.title {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    color: white;
    z-index: 10;
    font-family: Arial;
}

.title h1 {
    margin: 0;
    font-size: 30px;
}

.title p {
    opacity: 0.7;
}

.status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(255,255,255,0.15);
    padding: 10px 20px;
    border-radius: 20px;
    z-index: 10;
    font-family: Arial;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div class="title">
    <h1>🌌 AI MAGIC UNIVERSE ✨</h1>
    <p>☝️ Magnet • ✋ Explosion</p>
</div>

<div class="status" id="status">
    ⭐ Universe Ready
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const video = document.getElementById("video");
const status = document.getElementById("status");


/* CANVAS */

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* HAND */

let fingerX = 0;
let fingerY = 0;

let fingerDetected = false;
let palmOpen = false;

let explosionTimer = 0;


/* STARS */

let stars = [];

const STAR_COUNT = 500;


function createStars() {

    stars = [];

    for (let i = 0; i < STAR_COUNT; i++) {

        stars.push({

            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,

            size: Math.random() * 2.5 + 0.5,

            alpha: Math.random() * 0.7 + 0.3,

            speed: Math.random() * 0.25 + 0.05,

            vx: 0,
            vy: 0

        });

    }
}

createStars();


/* EXPLOSION */

function explodeStars() {

    for (let star of stars) {

        const dx = star.x - fingerX;
        const dy = star.y - fingerY;

        const distance =
            Math.sqrt(dx * dx + dy * dy);


        if (distance > 1) {

            const force =
                Math.max(0.4, 1 - distance / 900);


            star.vx +=
                (dx / distance) *
                force *
                18;


            star.vy +=
                (dy / distance) *
                force *
                18;

        }

    }


    explosionTimer = 20;

}


/* ANIMATION */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for (let star of stars) {


        /* NORMAL MOVEMENT */

        star.y -= star.speed;


        /* EXPLOSION */

        star.x += star.vx;
        star.y += star.vy;


        /* FRICTION */

        star.vx *= 0.95;
        star.vy *= 0.95;


        /* MAGNET */

        if (fingerDetected && !palmOpen) {

            const dx =
                fingerX - star.x;

            const dy =
                fingerY - star.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);


            if (distance < 450 && distance > 5) {

                const pull =
                    (450 - distance) / 450;


                star.x +=
                    dx * pull * 0.035;

                star.y +=
                    dy * pull * 0.035;


                /* SWIRL */

                star.x +=
                    -dy * pull * 0.018;

                star.y +=
                    dx * pull * 0.018;

            }

        }


        /* WRAP */

        if (star.y < 0) {
            star.y = canvas.height;
        }

        if (star.x < 0) {
            star.x = canvas.width;
        }

        if (star.x > canvas.width) {
            star.x = 0;
        }


        /* STAR */

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${star.alpha})`;

        ctx.fill();

    }


    /* FINGER EFFECT */

    if (fingerDetected) {

        /* LARGE RING */

        ctx.beginPath();

        ctx.arc(
            fingerX,
            fingerY,
            70,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            palmOpen
            ? "rgba(255,120,255,0.8)"
            : "rgba(0,220,255,0.4)";

        ctx.lineWidth = 3;

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            palmOpen ? "magenta" : "cyan";

        ctx.stroke();


        /* CORE */

        ctx.beginPath();

        ctx.arc(
            fingerX,
            fingerY,
            palmOpen ? 14 : 9,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "white";

        ctx.shadowBlur = 40;

        ctx.shadowColor =
            palmOpen ? "magenta" : "cyan";

        ctx.fill();

        ctx.shadowBlur = 0;

    }


    /* EXPLOSION FLASH */

    if (explosionTimer > 0) {

        ctx.beginPath();

        ctx.arc(
            fingerX,
            fingerY,
            (20 - explosionTimer) * 20,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `rgba(255,150,255,${explosionTimer / 20})`;

        ctx.lineWidth = 5;

        ctx.stroke();

        explosionTimer--;

    }


    requestAnimationFrame(animate);

}

animate();


/* AI HAND TRACKING */

const hands = new Hands({

    locateFile: function(file) {

        return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


hands.onResults(function(results) {

    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        const hand =
            results.multiHandLandmarks[0];


        /* INDEX FINGER */

        const indexFinger = hand[8];

        fingerX =
            (1 - indexFinger.x) *
            canvas.width;

        fingerY =
            indexFinger.y *
            canvas.height;

        fingerDetected = true;


        /*
        SIMPLE OPEN HAND DETECTION

        Check whether fingers are extended.
        */

        const indexOpen =
            hand[8].y < hand[6].y;

        const middleOpen =
            hand[12].y < hand[10].y;

        const ringOpen =
            hand[16].y < hand[14].y;

        const pinkyOpen =
            hand[20].y < hand[18].y;


        const openCount =
            Number(indexOpen) +
            Number(middleOpen) +
            Number(ringOpen) +
            Number(pinkyOpen);


        /*
        3 OR MORE OPEN FINGERS
        = OPEN PALM
        */

        const newPalmOpen =
            openCount >= 3;


        /*
        Trigger explosion only
        when palm becomes open
        */

        if (
            newPalmOpen &&
            !palmOpen
        ) {

            palmOpen = true;

            explodeStars();

        }

        else if (!newPalmOpen) {

            palmOpen = false;

        }


        /* STATUS */

        if (palmOpen) {

            status.innerText =
                "💥 STAR EXPLOSION!";

        }

        else {

            status.innerText =
                "🧲 MAGIC MAGNET ACTIVE";

        }

    }

    else {

        fingerDetected = false;
        palmOpen = false;

        status.innerText =
            "☝️ Show your hand";

    }

});


/* CAMERA */

const camera = new Camera(video, {

    onFrame: async function() {

        await hands.send({
            image: video
        });

    },

    width: 640,
    height: 480

});

camera.start();

</script>

</body>
</html>
