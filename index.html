<!DOCTYPE html>
<html>
<head>

<title>AI Magic Universe</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #080020, #000000 70%);
  font-family: Arial, sans-serif;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
}

#video {
  display: none;
}

/* =========================
   TITLE
========================= */

#title {
  position: fixed;
  top: 18px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 28px;
  font-weight: bold;
  z-index: 10;
  text-shadow: 0 0 15px #00ffff;
}

/* =========================
   STATUS
========================= */

#status {
  position: fixed;
  top: 65px;
  left: 20px;

  color: white;
  font-size: 17px;

  background: rgba(0,0,0,0.55);

  padding: 10px 16px;

  border-radius: 15px;

  border: 1px solid rgba(255,255,255,0.2);

  z-index: 10;
}

/* =========================
   INSTRUCTIONS
========================= */

#controls {

  position: fixed;

  bottom: 20px;

  left: 20px;

  color: white;

  background: rgba(0,0,0,0.55);

  padding: 12px 16px;

  border-radius: 15px;

  font-size: 14px;

  line-height: 1.7;

  z-index: 10;
}

</style>

</head>


<body>


<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>


<div id="title">
🌌 AI MAGIC UNIVERSE ✨
</div>


<div id="status">
🤖 Starting AI...
</div>


<div id="controls">

☝️ 1 Finger → Magnet 🧲<br>
✌️ 2 Fingers → Vortex 🌀<br>
🖐️ 3 Fingers → Explosion 💥<br>
✋ Full Palm → Supernova 🌟<br>
👊 Fist → Black Hole 🕳️

</div>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>


// ==========================================
// CANVAS
// ==========================================

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const video =
document.getElementById("video");

const status =
document.getElementById("status");


canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;


// ==========================================
// STARS
// ==========================================

const STAR_COUNT = 650;

let stars = [];


for (let i = 0; i < STAR_COUNT; i++) {

  stars.push({

    x: Math.random() * canvas.width,

    y: Math.random() * canvas.height,

    vx: 0,

    vy: 0,

    size: Math.random() * 2 + 0.5,

    alpha: Math.random(),

    twinkle: Math.random() * 0.03 + 0.01

  });

}


// ==========================================
// HAND VARIABLES
// ==========================================

let fingerDetected = false;

let fingerX = 0;

let fingerY = 0;


let handX = 0;

let handY = 0;


let currentGesture = 0;


// ==========================================
// EXPLOSION VARIABLES
// ==========================================

let explosionPower = 0;

let explosionLife = 0;


// ==========================================
// BLACK HOLE
// ==========================================

let blackHoleX = 0;

let blackHoleY = 0;


// ==========================================
// PARTICLE TRAIL
// ==========================================

let trails = [];


// ==========================================
// MAGNET
// ==========================================

function magnetEffect() {

  if (!fingerDetected) return;

  if (currentGesture !== 1) return;


  for (let star of stars) {

    const dx =
    fingerX - star.x;

    const dy =
    fingerY - star.y;

    const distance =
    Math.sqrt(dx * dx + dy * dy);


    if (
      distance < 430 &&
      distance > 8
    ) {

      const force =
      (430 - distance) / 430;


      star.x +=
      dx * force * 0.035;

      star.y +=
      dy * force * 0.035;


      // MAGIC SWIRL

      star.x +=
      -dy * force * 0.018;

      star.y +=
      dx * force * 0.018;

    }

  }

}


// ==========================================
// TWO FINGER VORTEX
// ==========================================

function vortexEffect() {

  if (!fingerDetected) return;

  if (currentGesture !== 2) return;


  const centerX = handX;

  const centerY = handY;


  for (let star of stars) {

    const dx =
    star.x - centerX;

    const dy =
    star.y - centerY;


    const distance =
    Math.sqrt(dx * dx + dy * dy);


    if (
      distance < 500 &&
      distance > 20
    ) {

      const force =
      (500 - distance) / 500;


      // ROTATION

      star.x +=
      -dy * force * 0.025;

      star.y +=
      dx * force * 0.025;


      // SMALL ATTRACTION

      star.x +=
      -dx * force * 0.008;

      star.y +=
      -dy * force * 0.008;

    }

  }

}


// ==========================================
// BLACK HOLE
// ==========================================

function blackHoleEffect() {

  if (currentGesture !== 0) return;


  // Only fist activates black hole

}


// ==========================================
// FIST BLACK HOLE
// ==========================================

function fistEffect() {

  if (currentGesture !== 0) return;


  const centerX = blackHoleX;

  const centerY = blackHoleY;


  for (let star of stars) {

    const dx =
    centerX - star.x;

    const dy =
    centerY - star.y;


    const distance =
    Math.sqrt(dx * dx + dy * dy);


    if (
      distance < 500 &&
      distance > 8
    ) {

      const force =
      (500 - distance) / 500;


      // STRONG SUCK

      star.x +=
      dx * force * 0.045;

      star.y +=
      dy * force * 0.045;


      // VORTEX

      star.x +=
      -dy * force * 0.035;

      star.y +=
      dx * force * 0.035;

    }


    // RESET WHEN REACHING CENTER

    if (distance < 12) {

      star.x =
      Math.random() * canvas.width;

      star.y =
      Math.random() * canvas.height;

      star.vx = 0;

      star.vy = 0;

    }

  }


  // BLACK HOLE CENTER

  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    45,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "black";

  ctx.fill();


  // INNER RING

  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    65,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
  "rgba(150,100,255,0.8)";

  ctx.lineWidth = 5;

  ctx.stroke();


  // OUTER RING

  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    90,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
  "rgba(0,255,255,0.35)";

  ctx.lineWidth = 3;

  ctx.stroke();

}


// ==========================================
// EXPLOSION
// ==========================================

function explodeStars(power) {

  const centerX =
  canvas.width / 2;

  const centerY =
  canvas.height / 2;


  for (let star of stars) {

    const dx =
    star.x - centerX;

    const dy =
    star.y - centerY;


    const distance =
    Math.sqrt(dx * dx + dy * dy) || 1;


    star.vx +=
    (dx / distance) * power;

    star.vy +=
    (dy / distance) * power;

  }


  explosionPower = power;

  explosionLife = 30;

}


// ==========================================
// DRAW EXPLOSION RING
// ==========================================

function drawExplosion() {

  if (explosionLife <= 0)
    return;


  const centerX =
  canvas.width / 2;

  const centerY =
  canvas.height / 2;


  const radius =
  (30 - explosionLife) * 25;


  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    radius,
    0,
    Math.PI * 2
  );


  ctx.strokeStyle =
  "rgba(255,255,255," +
  (explosionLife / 30) +
  ")";


  ctx.lineWidth = 6;

  ctx.stroke();


  explosionLife--;

}


// ==========================================
// STAR TRAIL
// ==========================================

function drawTrail() {

  if (!fingerDetected)
    return;


  trails.push({

    x: fingerX,

    y: fingerY,

    life: 1

  });


  if (trails.length > 25)
    trails.shift();


  for (let trail of trails) {

    ctx.beginPath();

    ctx.arc(
      trail.x,
      trail.y,
      4,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
    "rgba(0,255,255," +
    trail.life +
    ")";


    ctx.fill();


    trail.life -= 0.04;

  }

}


// ==========================================
// MAIN ANIMATION
// ==========================================

function animate() {

  // transparent black fade

  ctx.fillStyle =
  "rgba(0,0,10,0.25)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // ========================================
  // STARS
  // ========================================

  for (let star of stars) {

    star.x += star.vx;

    star.y += star.vy;


    // friction

    star.vx *= 0.975;

    star.vy *= 0.975;


    // twinkle

    star.alpha += star.twinkle;


    if (star.alpha > 1)
      star.alpha = 0;


    // screen wrap

    if (star.x < 0)
      star.x = canvas.width;

    if (star.x > canvas.width)
      star.x = 0;

    if (star.y < 0)
      star.y = canvas.height;

    if (star.y > canvas.height)
      star.y = 0;


    // DRAW STAR

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
    "rgba(255,255,255," +
    (0.4 + star.alpha * 0.6) +
    ")";


    ctx.fill();

  }


  // ========================================
  // EFFECTS
  // ========================================

  magnetEffect();

  vortexEffect();

  fistEffect();

  drawTrail();

  drawExplosion();


  // ========================================
  // FINGER MAGIC RING
  // ========================================

  if (
    fingerDetected &&
    currentGesture === 1
  ) {

    ctx.beginPath();

    ctx.arc(
      fingerX,
      fingerY,
      28,
      0,
      Math.PI * 2
    );


    ctx.strokeStyle =
    "#00ffff";

    ctx.lineWidth = 4;

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
      fingerX,
      fingerY,
      45,
      0,
      Math.PI * 2
    );


    ctx.strokeStyle =
    "rgba(0,255,255,0.3)";

    ctx.lineWidth = 2;

    ctx.stroke();

  }


  requestAnimationFrame(animate);

}


animate();


// ==========================================
// MEDIAPIPE HANDS
// ==========================================

const hands =
new Hands({

  locateFile: (file) => {

    return (
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    );

  }

});


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 1,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


let lastExplosion = 0;


// ==========================================
// HAND RESULTS
// ==========================================

hands.onResults((results) => {


  if (
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ) {

    fingerDetected = false;

    currentGesture = -1;

    status.innerText =
    "🤚 Show your hand";

    return;

  }


  const hand =
  results.multiHandLandmarks[0];


  const wrist =
  hand[0];


  // ========================================
  // HAND POSITION
  // ========================================

  fingerDetected = true;


  fingerX =
  (1 - hand[8].x) *
  canvas.width;


  fingerY =
  hand[8].y *
  canvas.height;


  blackHoleX =
  (1 - hand[9].x) *
  canvas.width;


  blackHoleY =
  hand[9].y *
  canvas.height;


  handX =
  (1 - hand[9].x) *
  canvas.width;


  handY =
  hand[9].y *
  canvas.height;


  // ========================================
  // FINGER OPEN CHECK
  // ========================================

  function fingerOpen(tip, pip) {

    const tipDistance =
    Math.hypot(
      tip.x - wrist.x,
      tip.y - wrist.y
    );


    const pipDistance =
    Math.hypot(
      pip.x - wrist.x,
      pip.y - wrist.y
    );


    return (
      tipDistance >
      pipDistance * 1.05
    );

  }


  const indexOpen =
  fingerOpen(
    hand[8],
    hand[6]
  );


  const middleOpen =
  fingerOpen(
    hand[12],
    hand[10]
  );


  const ringOpen =
  fingerOpen(
    hand[16],
    hand[14]
  );


  const pinkyOpen =
  fingerOpen(
    hand[20],
    hand[18]
  );


  // ========================================
  // COUNT
  // ========================================

  let openCount = 0;


  if (indexOpen)
    openCount++;


  if (middleOpen)
    openCount++;


  if (ringOpen)
    openCount++;


  if (pinkyOpen)
    openCount++;


  // ========================================
  // FULL PALM
  // ========================================

  if (openCount === 4) {

    currentGesture = 4;


    status.innerText =
    "✋ FULL PALM — SUPERNOVA 🌟";


    const now =
    Date.now();


    if (
      now - lastExplosion >
      1000
    ) {

      explodeStars(18);

      lastExplosion = now;

    }

  }


  // ========================================
  // THREE FINGERS
  // ========================================

  else if (openCount === 3) {

    currentGesture = 3;


    status.innerText =
    "🖐️ 3 FINGERS — EXPLOSION 💥";


    const now =
    Date.now();


    if (
      now - lastExplosion >
      1000
    ) {

      explodeStars(10);

      lastExplosion = now;

    }

  }


  // ========================================
  // TWO FINGERS
  // ========================================

  else if (openCount === 2) {

    currentGesture = 2;


    status.innerText =
    "✌️ TWO FINGERS — COSMIC VORTEX 🌀";

  }


  // ========================================
  // ONE FINGER
  // ========================================

  else if (openCount === 1) {

    currentGesture = 1;


    status.innerText =
    "☝️ MAGIC MAGNET ACTIVE 🧲";

  }


  // ========================================
  // FIST
  // ========================================

  else {

    currentGesture = 0;


    status.innerText =
    "👊 BLACK HOLE ACTIVE 🕳️";

  }

});


// ==========================================
// CAMERA
// ==========================================

const camera =
new Camera(video, {

  onFrame: async () => {

    await hands.send({
      image: video
    });

  },

  width: 640,

  height: 480

});


camera.start();


// ==========================================
// RESIZE
// ==========================================

window.addEventListener(
"resize",
() => {

  canvas.width =
  window.innerWidth;

  canvas.height =
  window.innerHeight;

});

</script>

</body>
</html>
