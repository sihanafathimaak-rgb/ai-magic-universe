<!DOCTYPE html>
<html>
<head>
  <title>AI Magic Universe</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
    }

    #video {
      display: none;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="status">🤖 Starting AI...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const video = document.getElementById("video");
const status = document.getElementById("status");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


// =====================================
// STARS
// =====================================

let stars = [];

for (let i = 0; i < 500; i++) {

  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,

    vx: 0,
    vy: 0,

    size: Math.random() * 2 + 1
  });

}


// =====================================
// FINGER POSITION
// =====================================

let fingerDetected = false;

let fingerX = 0;
let fingerY = 0;


// =====================================
// MAGNET
// =====================================

function magnetStars() {

  if (!fingerDetected) return;

  for (let star of stars) {

    const dx = fingerX - star.x;
    const dy = fingerY - star.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 400 && distance > 5) {

      const pull = (400 - distance) / 400;

      star.x += dx * pull * 0.035;
      star.y += dy * pull * 0.035;

      // swirl
      star.x += -dy * pull * 0.015;
      star.y += dx * pull * 0.015;
    }
  }
}


// =====================================
// EXPLOSION
// =====================================

function explodeStars(power) {

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  for (let star of stars) {

    const dx = star.x - centerX;
    const dy = star.y - centerY;

    const distance =
      Math.sqrt(dx * dx + dy * dy) || 1;

    star.vx += (dx / distance) * power;
    star.vy += (dy / distance) * power;
  }

  // Explosion ring

  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    80,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle = "white";
  ctx.lineWidth = 8;
  ctx.stroke();
}


// =====================================
// DRAW
// =====================================

function animate() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // Move stars

  for (let star of stars) {

    star.x += star.vx;
    star.y += star.vy;

    star.vx *= 0.97;
    star.vy *= 0.97;


    // Wrap around screen

    if (star.x < 0)
      star.x = canvas.width;

    if (star.x > canvas.width)
      star.x = 0;

    if (star.y < 0)
      star.y = canvas.height;

    if (star.y > canvas.height)
      star.y = 0;


    // Draw

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();
  }


  magnetStars();


  // Finger glow

  if (fingerDetected) {

    ctx.beginPath();

    ctx.arc(
      fingerX,
      fingerY,
      25,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 4;
    ctx.stroke();
  }


  requestAnimationFrame(animate);
}

animate();


// =====================================
// MEDIAPIPE
// =====================================

const hands = new Hands({

  locateFile: (file) => {

    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

  }

});


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 1,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


// =====================================
// GESTURE DETECTION
// =====================================

let lastExplosion = 0;

hands.onResults((results) => {

  if (
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ) {

    fingerDetected = false;

    status.innerText = "🤚 Show your hand";

    return;
  }


  const hand =
    results.multiHandLandmarks[0];


  // =================================
  // INDEX FINGER POSITION
  // =================================

  fingerDetected = true;

  fingerX =
    (1 - hand[8].x) * canvas.width;

  fingerY =
    hand[8].y * canvas.height;


  // =================================
  // CHECK FINGERS
  // =================================

  const wrist = hand[0];


  function fingerOpen(tip, pip) {

    const tipDistance = Math.hypot(
      tip.x - wrist.x,
      tip.y - wrist.y
    );

    const pipDistance = Math.hypot(
      pip.x - wrist.x,
      pip.y - wrist.y
    );

    return tipDistance > pipDistance * 1.05;
  }


  const indexOpen =
    fingerOpen(hand[8], hand[6]);

  const middleOpen =
    fingerOpen(hand[12], hand[10]);

  const ringOpen =
    fingerOpen(hand[16], hand[14]);

  const pinkyOpen =
    fingerOpen(hand[20], hand[18]);


  let openCount = 0;

  if (indexOpen) openCount++;
  if (middleOpen) openCount++;
  if (ringOpen) openCount++;
  if (pinkyOpen) openCount++;


  // =================================
  // FULL PALM
  // =================================

  if (openCount === 4) {

    status.innerText =
      "✋ FULL PALM — MAGIC EXPLOSION!";


    const now = Date.now();

    if (now - lastExplosion > 900) {

      explodeStars(18);

      lastExplosion = now;
    }

  }


  // =================================
  // 3 FINGERS
  // =================================

  else if (openCount === 3) {

    status.innerText =
      "🖐️ 3 FINGERS — EXPLOSION!";


    const now = Date.now();

    if (now - lastExplosion > 900) {

      explodeStars(10);

      lastExplosion = now;
    }

  }


  // =================================
  // 1 FINGER
  // =================================

  else if (openCount === 1) {

    status.innerText =
      "☝️ MAGIC MAGNET ACTIVE";

  }


  // =================================
  // OTHER
  // =================================

  else {

    status.innerText =
      "🤖 AI MAGIC READY";

  }

});


// =====================================
// CAMERA
// =====================================

const camera = new Camera(video, {

  onFrame: async () => {

    await hands.send({
      image: video
    });

  },

  width: 640,
  height: 480

});

camera.start();


// =====================================
// RESIZE
// =====================================

window.addEventListener("resize", () => {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

});

</script>

</body>
</html>
