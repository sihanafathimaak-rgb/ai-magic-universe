<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Magic Universe</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial;
    color: white;
}

#video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.15;
}

#canvas {
    position: fixed;
    left: 0;
    top: 0;
}

.title {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

.title h1 {
    margin: 0;
    font-size: 30px;
}

.status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.15);
    padding: 10px 18px;
    border-radius: 20px;
    z-index: 10;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div class="title">
    <h1>🌌 AI MAGIC UNIVERSE ✨</h1>
    <p>Control the universe with your finger</p>
</div>

<div class="status" id="status">
    🤖 Starting AI...
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const status = document.getElementById("status");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


/* FINGER POSITION */

let fingerX = 0;
let fingerY = 0;

let detected = false;


/* CREATE STARS */

const stars = [];

for (let i = 0; i < 600; i++) {

    stars.push({

        x: Math.random() * canvas.width,

        y: Math.random() * canvas.height,

        size: Math.random() * 2 + 1,

        speed: Math.random() * 0.5 + 0.1

    });

}


/* AI HAND */

const hands = new Hands({

    locateFile: function(file) {

        return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


hands.onResults(function(results) {

    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        const hand = results.multiHandLandmarks[0];

        /* INDEX FINGER TIP */

        const finger = hand[8];

        fingerX =
            (1 - finger.x) * canvas.width;

        fingerY =
            finger.y * canvas.height;

        detected = true;

        status.innerText =
            "✨ AI MAGIC ACTIVE";

    } else {

        detected = false;

        status.innerText =
            "☝️ Show your hand";

    }

});


/* CAMERA */

const camera = new Camera(video, {

    onFrame: async function() {

        await hands.send({
            image: video
        });

    },

    width: 640,

    height: 480

});

camera.start();


/* DRAW */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* STARS */

    for (let star of stars) {

        star.y -= star.speed;

        if (star.y < 0) {

            star.y = canvas.height;

        }


        let x = star.x;
        let y = star.y;


        /* FINGER MAGIC */

        if (detected) {

            let dx = fingerX - x;
            let dy = fingerY - y;

            let distance =
                Math.sqrt(dx * dx + dy * dy);


            if (distance < 180) {

                x += dx * 0.04;
                y += dy * 0.04;

            }

        }


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "white";

        ctx.shadowBlur = 10;

        ctx.shadowColor = "cyan";

        ctx.fill();

        ctx.shadowBlur = 0;

    }


    /* FINGER GLOW */

    if (detected) {

        ctx.beginPath();

        ctx.arc(
            fingerX,
            fingerY,
            10,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "white";

        ctx.shadowBlur = 40;

        ctx.shadowColor = "cyan";

        ctx.fill();

        ctx.shadowBlur = 0;

    }


    requestAnimationFrame(animate);

}


animate();


/* RESIZE */

window.addEventListener("resize", function() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

</script>

</body>
</html>
