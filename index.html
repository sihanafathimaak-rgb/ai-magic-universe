<!DOCTYPE html>
<html>
<head>

<title>AI Magic Universe</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
}

#video {
  display: none;
}

#title {
  position: fixed;
  top: 18px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 28px;
  font-weight: bold;
  z-index: 10;
  text-shadow: 0 0 15px #00ffff;
}

#status {
  position: fixed;
  top: 65px;
  left: 20px;
  color: white;
  font-size: 17px;
  z-index: 10;
  background: rgba(0,0,0,0.55);
  padding: 10px 16px;
  border-radius: 15px;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  color: white;
  background: rgba(0,0,0,0.55);
  padding: 12px 16px;
  border-radius: 15px;
  font-size: 14px;
  line-height: 1.7;
  z-index: 10;
}

</style>

</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div id="title">
🌌 AI MAGIC UNIVERSE ✨
</div>

<div id="status">
🤖 Starting AI...
</div>

<div id="controls">
☝️ 1 Finger → Magnet 🧲<br>
✌️ 2 Fingers → Vortex 🌀<br>
🖐️ 3 Fingers → Explosion 💥<br>
✋ Full Palm → Supernova 🌟<br>
👊 Fist → Black Hole 🕳️
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const video = document.getElementById("video");
const status = document.getElementById("status");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


// ==========================================
// PLANETS
// ==========================================

const planets = [

  {
    x: 0.15,
    y: 0.25,
    radius: 55,
    type: "blue",
    ring: false
  },

  {
    x: 0.82,
    y: 0.22,
    radius: 75,
    type: "purple",
    ring: true
  },

  {
    x: 0.88,
    y: 0.72,
    radius: 42,
    type: "red",
    ring: false
  },

  {
    x: 0.20,
    y: 0.78,
    radius: 32,
    type: "green",
    ring: true
  }

];


// ==========================================
// DRAW PLANETS
// ==========================================

function drawPlanets() {

  for (let planet of planets) {

    const x =
      planet.x * canvas.width;

    const y =
      planet.y * canvas.height;

    const r = planet.radius;


    // ------------------------------
    // GLOW
    // ------------------------------

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r + 15,
      0,
      Math.PI * 2
    );

    let glow;

    if (planet.type === "blue") {

      glow = "rgba(0,150,255,0.18)";

    } else if (planet.type === "purple") {

      glow = "rgba(180,80,255,0.18)";

    } else if (planet.type === "red") {

      glow = "rgba(255,80,50,0.18)";

    } else {

      glow = "rgba(50,255,150,0.18)";
    }

    ctx.fillStyle = glow;

    ctx.fill();

    ctx.restore();


    // ------------------------------
    // PLANET GRADIENT
    // ------------------------------

    let gradient =
      ctx.createRadialGradient(
        x - r * 0.35,
        y - r * 0.35,
        r * 0.1,
        x,
        y,
        r
      );


    if (planet.type === "blue") {

      gradient.addColorStop(0, "#9eeaff");
      gradient.addColorStop(0.45, "#168cff");
      gradient.addColorStop(1, "#00143d");

    }

    else if (planet.type === "purple") {

      gradient.addColorStop(0, "#ffd6ff");
      gradient.addColorStop(0.45, "#9b35ff");
      gradient.addColorStop(1, "#21002f");

    }

    else if (planet.type === "red") {

      gradient.addColorStop(0, "#ffb08a");
      gradient.addColorStop(0.5, "#e13b28");
      gradient.addColorStop(1, "#3d0500");

    }

    else {

      gradient.addColorStop(0, "#baffdf");
      gradient.addColorStop(0.5, "#20b879");
      gradient.addColorStop(1, "#00291d");

    }


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = gradient;

    ctx.fill();


    // ------------------------------
    // PLANET DETAILS
    // ------------------------------

    ctx.save();

    ctx.globalAlpha = 0.18;

    ctx.beginPath();

    ctx.ellipse(
      x - r * 0.15,
      y + r * 0.1,
      r * 0.55,
      r * 0.12,
      -0.2,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();

    ctx.restore();


    // ------------------------------
    // RING
    // ------------------------------

    if (planet.ring) {

      ctx.save();

      ctx.translate(x, y);

      ctx.rotate(-0.25);

      ctx.beginPath();

      ctx.ellipse(
        0,
        0,
        r * 1.65,
        r * 0.38,
        0,
        0,
        Math.PI * 2
      );

      ctx.strokeStyle =
        "rgba(220,220,255,0.65)";

      ctx.lineWidth = 5;

      ctx.stroke();

      ctx.restore();
    }

  }

}


// ==========================================
// STARS
// ==========================================

const STAR_COUNT = 650;

let stars = [];


for (let i = 0; i < STAR_COUNT; i++) {

  stars.push({

    x: Math.random() * canvas.width,

    y: Math.random() * canvas.height,

    vx: 0,

    vy: 0,

    size: Math.random() * 2 + 0.5,

    alpha: Math.random(),

    twinkle: Math.random() * 0.03 + 0.01

  });

}


// ==========================================
// HAND VARIABLES
// ==========================================

let fingerDetected = false;

let fingerX = 0;
let fingerY = 0;

let handX = 0;
let handY = 0;

let currentGesture = -1;

let blackHoleX = 0;
let blackHoleY = 0;

let explosionLife = 0;

let trails = [];


// ==========================================
// MAGNET
// ==========================================

function magnetEffect() {

  if (!fingerDetected) return;

  if (currentGesture !== 1) return;


  for (let star of stars) {

    const dx =
      fingerX - star.x;

    const dy =
      fingerY - star.y;

    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if (
      distance < 430 &&
      distance > 8
    ) {

      const force =
        (430 - distance) / 430;


      star.x +=
        dx * force * 0.035;

      star.y +=
        dy * force * 0.035;


      star.x +=
        -dy * force * 0.018;

      star.y +=
        dx * force * 0.018;

    }

  }

}


// ==========================================
// VORTEX
// ==========================================

function vortexEffect() {

  if (!fingerDetected) return;

  if (currentGesture !== 2) return;


  for (let star of stars) {

    const dx =
      star.x - handX;

    const dy =
      star.y - handY;

    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if (
      distance < 500 &&
      distance > 20
    ) {

      const force =
        (500 - distance) / 500;


      star.x +=
        -dy * force * 0.025;

      star.y +=
        dx * force * 0.025;


      star.x +=
        -dx * force * 0.008;

      star.y +=
        -dy * force * 0.008;

    }

  }

}


// ==========================================
// BLACK HOLE
// ==========================================

function fistEffect() {

  if (currentGesture !== 0) return;


  for (let star of stars) {

    const dx =
      blackHoleX - star.x;

    const dy =
      blackHoleY - star.y;

    const distance =
      Math.sqrt(dx * dx + dy * dy);


    if (
      distance < 500 &&
      distance > 8
    ) {

      const force =
        (500 - distance) / 500;


      star.x +=
        dx * force * 0.045;

      star.y +=
        dy * force * 0.045;


      star.x +=
        -dy * force * 0.035;

      star.y +=
        dx * force * 0.035;

    }


    if (distance < 12) {

      star.x =
        Math.random() * canvas.width;

      star.y =
        Math.random() * canvas.height;

      star.vx = 0;
      star.vy = 0;

    }

  }


  // BLACK HOLE

  ctx.beginPath();

  ctx.arc(
    blackHoleX,
    blackHoleY,
    45,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "black";

  ctx.fill();


  // RINGS

  ctx.beginPath();

  ctx.arc(
    blackHoleX,
    blackHoleY,
    65,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    "rgba(180,100,255,0.8)";

  ctx.lineWidth = 5;

  ctx.stroke();


  ctx.beginPath();

  ctx.arc(
    blackHoleX,
    blackHoleY,
    90,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    "rgba(0,255,255,0.35)";

  ctx.lineWidth = 3;

  ctx.stroke();

}


// ==========================================
// EXPLOSION
// ==========================================

function explodeStars(power) {

  const centerX =
    canvas.width / 2;

  const centerY =
    canvas.height / 2;


  for (let star of stars) {

    const dx =
      star.x - centerX;

    const dy =
      star.y - centerY;

    const distance =
      Math.sqrt(dx * dx + dy * dy) || 1;


    star.vx +=
      (dx / distance) * power;

    star.vy +=
      (dy / distance) * power;

  }


  explosionLife = 30;

}


// ==========================================
// EXPLOSION RING
// ==========================================

function drawExplosion() {

  if (explosionLife <= 0)
    return;


  const centerX =
    canvas.width / 2;

  const centerY =
    canvas.height / 2;


  const radius =
    (30 - explosionLife) * 25;


  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    radius,
    0,
    Math.PI * 2
  );


  ctx.strokeStyle =
    "rgba(255,255,255," +
    (explosionLife / 30) +
    ")";


  ctx.lineWidth = 6;

  ctx.stroke();


  explosionLife--;

}


// ==========================================
// TRAIL
// ==========================================

function drawTrail() {

  if (!fingerDetected)
    return;


  trails.push({

    x: fingerX,

    y: fingerY,

    life: 1

  });


  if (trails.length > 25)
    trails.shift();


  for (let trail of trails) {

    ctx.beginPath();

    ctx.arc(
      trail.x,
      trail.y,
      4,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      "rgba(0,255,255," +
      trail.life +
      ")";


    ctx.fill();

    trail.life -= 0.04;

  }

}


// ==========================================
// ANIMATION
// ==========================================

function animate() {


  // BACKGROUND

  ctx.fillStyle =
    "rgba(0,0,10,0.25)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // PLANETS FIRST
  // So they stay in background

  drawPlanets();


  // STARS

  for (let star of stars) {

    star.x += star.vx;
    star.y += star.vy;


    star.vx *= 0.975;
    star.vy *= 0.975;


    star.alpha += star.twinkle;


    if (star.alpha > 1)
      star.alpha = 0;


    if (star.x < 0)
      star.x = canvas.width;

    if (star.x > canvas.width)
      star.x = 0;

    if (star.y < 0)
      star.y = canvas.height;

    if (star.y > canvas.height)
      star.y = 0;


    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      "rgba(255,255,255," +
      (0.4 + star.alpha * 0.6) +
      ")";


    ctx.fill();

  }


  // EFFECTS

  magnetEffect();

  vortexEffect();

  fistEffect();

  drawTrail();

  drawExplosion();


  // FINGER MAGIC RING

  if (
    fingerDetected &&
    currentGesture === 1
  ) {

    ctx.beginPath();

    ctx.arc(
      fingerX,
      fingerY,
      28,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "#00ffff";

    ctx.lineWidth = 4;

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
      fingerX,
      fingerY,
      45,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "rgba(0,255,255,0.3)";

    ctx.lineWidth = 2;

    ctx.stroke();

  }


  requestAnimationFrame(animate);

}


animate();


// ==========================================
// MEDIAPIPE
// ==========================================

const hands =
  new Hands({

    locateFile: (file) => {

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 1,

  minDetectionConfidence: 0.6,

  minTrackingConfidence: 0.6

});


let lastExplosion = 0;


// ==========================================
// HAND RESULTS
// ==========================================

hands.onResults((results) => {


  if (
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ) {

    fingerDetected = false;

    currentGesture = -1;

    status.innerText =
      "🤚 Show your hand";

    return;

  }


  const hand =
    results.multiHandLandmarks[0];


  const wrist =
    hand[0];


  // INDEX POSITION

  fingerDetected = true;


  fingerX =
    (1 - hand[8].x) *
    canvas.width;


  fingerY =
    hand[8].y *
    canvas.height;


  // PALM POSITION

  handX =
    (1 - hand[9].x) *
    canvas.width;

  handY =
    hand[9].y *
    canvas.height;


  blackHoleX =
    handX;

  blackHoleY =
    handY;


  // FINGER CHECK

  function fingerOpen(tip, pip) {

    const tipDistance =
      Math.hypot(
        tip.x - wrist.x,
        tip.y - wrist.y
      );


    const pipDistance =
      Math.hypot(
        pip.x - wrist.x,
        pip.y - wrist.y
      );


    return (
      tipDistance >
      pipDistance * 1.05
    );

  }


  const indexOpen =
    fingerOpen(
      hand[8],
      hand[6]
    );


  const middleOpen =
    fingerOpen(
      hand[12],
      hand[10]
    );


  const ringOpen =
    fingerOpen(
      hand[16],
      hand[14]
    );


  const pinkyOpen =
    fingerOpen(
      hand[20],
      hand[18]
    );


  let openCount = 0;


  if (indexOpen)
    openCount++;


  if (middleOpen)
    openCount++;


  if (ringOpen)
    openCount++;


  if (pinkyOpen)
    openCount++;


  // ========================================
  // FULL PALM
  // ========================================

  if (openCount === 4) {

    currentGesture = 4;


    status.innerText =
      "✋ FULL PALM — SUPERNOVA 🌟";


    const now =
      Date.now();


    if (
      now - lastExplosion > 1000
    ) {

      explodeStars(18);

      lastExplosion = now;

    }

  }


  // ========================================
  // 3 FINGERS
  // ========================================

  else if (openCount === 3) {

    currentGesture = 3;


    status.innerText =
      "🖐️ 3 FINGERS — EXPLOSION 💥";


    const now =
      Date.now();


    if (
      now - lastExplosion > 1000
    ) {

      explodeStars(10);

      lastExplosion = now;

    }

  }


  // ========================================
  // 2 FINGERS
  // ========================================

  else if (openCount === 2) {

    currentGesture = 2;


    status.innerText =
      "✌️ TWO FINGERS — COSMIC VORTEX 🌀";

  }


  // ========================================
  // 1 FINGER
  // ========================================

  else if (openCount === 1) {

    currentGesture = 1;


    status.innerText =
      "☝️ MAGIC MAGNET ACTIVE 🧲";

  }


  // ========================================
  // FIST
  // ========================================

  else {

    currentGesture = 0;


    status.innerText =
      "👊 BLACK HOLE ACTIVE 🕳️";

  }

});


// ==========================================
// CAMERA
// ==========================================

const camera =
  new Camera(video, {

    onFrame: async () => {

      await hands.send({
        image: video
      });

    },

    width: 640,

    height: 480

  });


camera.start();


// ==========================================
// RESIZE
// ==========================================

window.addEventListener(
  "resize",
  () => {

    canvas.width =
      window.innerWidth;

    canvas.height =
      window.innerHeight;

  }
);

</script>

</body>
</html>
